name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch: # Permite ejecutar manualmente el workflow
        inputs:
            import_mtg_meta:
                description: 'Run MTGTop8 importer instead of deploying Pages'
                required: false
                default: 'false'
                type: choice
                options:
                    - 'false'
                    - 'true'
            import_mtg_market:
                description: 'Run MTGJSON market importer instead of deploying Pages'
                required: false
                default: 'false'
                type: choice
                options:
                    - 'false'
                    - 'true'
    schedule:
        # Weekly MTGTop8 refresh: Mondays at 08:17 UTC.
        - cron: '17 8 * * 1'

# Default to the minimum permission; deploy overrides this per job.
permissions:
    contents: read

# Permitir solo un deployment concurrente
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    import-mtg-data:
        if: github.event_name == 'schedule' || inputs.import_mtg_meta == 'true' || inputs.import_mtg_market == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            MTGTOP8_META: '52'
            MTGTOP8_MAX_ARCHETYPES: '10'
            MTGTOP8_MAX_DECKS_PER_ARCHETYPE: '10'
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 11.1.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --prod --frozen-lockfile --ignore-scripts

            - name: Import MTGTop8 metagame decks
              if: github.event_name == 'schedule' || inputs.import_mtg_meta == 'true'
              run: pnpm run mtg:import-meta
              env:
                  INSFORGE_URL: ${{ secrets.INSFORGE_URL || secrets.VITE_INSFORGE_URL }}
                  INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY || secrets.INSFORGE_SERVICE_ROLE_KEY }}

            - name: Import MTGJSON market data
              if: inputs.import_mtg_market == 'true'
              run: pnpm run mtg:import-market
              env:
                  INSFORGE_URL: ${{ secrets.INSFORGE_URL || secrets.VITE_INSFORGE_URL }}
                  INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY || secrets.INSFORGE_SERVICE_ROLE_KEY }}

    build:
        if: github.event_name != 'schedule' && inputs.import_mtg_meta != 'true' && inputs.import_mtg_market != 'true'
        environment: github-pages
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            VITE_INSFORGE_URL: ${{ vars.VITE_INSFORGE_URL || secrets.VITE_INSFORGE_URL }}
            VITE_INSFORGE_ANON_KEY: ${{ vars.VITE_INSFORGE_ANON_KEY || secrets.VITE_INSFORGE_ANON_KEY }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 11.1.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Upload build artifacts
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: './dist'

    deploy:
        if: github.event_name != 'schedule' && inputs.import_mtg_meta != 'true' && inputs.import_mtg_market != 'true'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
